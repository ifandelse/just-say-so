# This repo's own Vale policy. The docs, rules payload, and tests name the
# banned words on purpose, so those paths run no styles.
StylesPath = styles
MinAlertLevel = suggestion

[*]
BasedOnStyles = JustSaySo

[*.chat.md]
BasedOnStyles = JustSaySo

[{README.md,adapters/README.md,rules/*,test/**,docs/**,coverage/**,styles/**,vale/**,*.test.js,src/lib/matcher.js,src/lib/style-gen.js,TODO.md,.ai/**}]
BasedOnStyles =
