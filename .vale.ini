# This repo's own Vale policy. The rules payload, the styles, and the tests
# name the banned words on purpose, so those paths run no styles. The
# style sections between the markers are rendered by scripts/build.js from
# rules/packages.json, the same block the shipped fallback carries.
StylesPath = styles
MinAlertLevel = suggestion

[formats]
reply = md
publish = md

# --- generated from rules/packages.json by scripts/build.js; do not edit by hand ---
[*]
BasedOnStyles = JustSaySo, ai-tells, STE
STE.Contractions = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO
STE.PassiveVoice = suggestion
STE.ProcedureLength = NO
STE.SentenceLength = suggestion
ai-tells.AnthropomorphicAdjectives = NO
ai-tells.BareHolds = NO
ai-tells.BareNames = NO
ai-tells.ColonUsage = NO
ai-tells.EvasionMetaphors = suggestion
ai-tells.ExplainerHeadings = NO
ai-tells.HouseStyle = NO
ai-tells.NamedAdjective = NO
ai-tells.NegatedObject = suggestion
ai-tells.RhetoricalDevices = suggestion
ai-tells.RhetoricalSelfAnswer = suggestion
ai-tells.ShipOveruse = NO
ai-tells.VerbTricolon = NO

[*.reply]
BasedOnStyles = JustSaySo, ai-tells, STE

[*.publish]
BasedOnStyles = JustSaySo, ai-tells, STE

# --- end generated ---

[{adapters/README.md,rules/*,test/**,coverage/**,styles/**,vale/**,*.test.js,src/lib/style-gen.js,TODO.md,.ai/**,docs/reports/**}]
BasedOnStyles =
