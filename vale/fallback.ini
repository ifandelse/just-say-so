# Shipped Vale config. Two jobs: the fallback when a checked file has no
# .vale.ini above it and jss config sets no vale.config, and the source of
# the .vale.ini inside the JustSaySo package (scripts/package-style.sh drops
# the StylesPath line). A project that lists the package in Packages gets
# the [formats] mapping and the target sections below merged into its own
# config, so its chat and published text lint without extra sections.
StylesPath = ../styles
MinAlertLevel = suggestion

# Chat replies lint as reply.reply; published fragments as
# <source>.<tool>.<field>.publish (gh.pr.body.publish). Both parse as
# Markdown. A [*.md] section never matches them, so document rules stay
# out of text that has no document.
[formats]
reply = md
publish = md

[*]
BasedOnStyles = JustSaySo

[*.reply]
BasedOnStyles = JustSaySo

[*.publish]
BasedOnStyles = JustSaySo

# Dependency manifests and generated files name terms nobody wrote as prose.
[{**/package*.json,**/*.lock,**/node_modules/**,**/*.min.*}]
BasedOnStyles =
