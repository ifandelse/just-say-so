# Shipped fallback config: used when a checked file has no .vale.ini above it
# and jss config sets no vale.config. Loads the JustSaySo style alone, so the
# plugin works out of the box and gets stronger in repos that adopt Vale.
StylesPath = ../styles
MinAlertLevel = suggestion

[*]
BasedOnStyles = JustSaySo

# Chat replies and gh/MCP fragments lint under this name; a project config
# can override this section to pick its own reduced rule set for chat.
[*.chat.md]
BasedOnStyles = JustSaySo

# Parity with the old checker's default excludes: dependency manifests and
# generated files name terms nobody wrote as prose.
[{**/package*.json,**/*.lock,**/node_modules/**,**/*.min.*}]
BasedOnStyles =
