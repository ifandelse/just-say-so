# Shipped Vale config. Two jobs: the fallback when a checked file has no
# .vale.ini above it and jss config sets no vale.config, and the source of
# the .vale.ini inside the JustSaySo package (scripts/package-style.sh drops
# the StylesPath line). A project that lists the package in Packages gets
# the [formats] mapping and the target sections below merged into its own
# config, so its chat and published text lint without extra sections.
#
# The style sections between the markers are rendered by scripts/build.js
# from rules/packages.json: the bundled styles, and the per-rule settings
# the plugin ships for them. Edit that file and run npm run build.
StylesPath = ../styles
MinAlertLevel = suggestion

# Chat replies lint as reply.reply; published fragments as
# <source>.<tool>.<field>.publish (gh.pr.body.publish). Both parse as
# Markdown. A [*.md] section never matches them, so document rules stay
# out of text that has no document.
[formats]
reply = md
publish = md

# --- generated from rules/packages.json by scripts/build.js; do not edit by hand ---
[*]
BasedOnStyles = JustSaySo, ai-tells, STE
STE.Contractions = NO
STE.Dictionary = NO
STE.Gerunds = NO
STE.Modals = NO
STE.PassiveVoice = suggestion
STE.ProcedureLength = NO
STE.SentenceLength = suggestion
ai-tells.AnthropomorphicAdjectives = NO
ai-tells.BareHolds = NO
ai-tells.BareNames = NO
ai-tells.ColonUsage = NO
ai-tells.EvasionMetaphors = suggestion
ai-tells.ExplainerHeadings = NO
ai-tells.HouseStyle = NO
ai-tells.NamedAdjective = NO
ai-tells.NegatedObject = suggestion
ai-tells.RhetoricalDevices = suggestion
ai-tells.RhetoricalSelfAnswer = suggestion
ai-tells.ShipOveruse = NO
ai-tells.VerbTricolon = NO

[*.reply]
BasedOnStyles = JustSaySo, ai-tells, STE

[*.publish]
BasedOnStyles = JustSaySo, ai-tells, STE

# --- end generated ---

# Dependency manifests and generated files name terms nobody wrote as prose.
[{**/package*.json,**/*.lock,**/node_modules/**,**/*.min.*}]
BasedOnStyles =
